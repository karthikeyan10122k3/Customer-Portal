<div class="sales-container">
  <!-- Page Heading -->
  <div class="sales-header">
    <h2>
      <mat-icon class="header-icon">shopping_cart_checkout</mat-icon>
      Customer Sales & Distribution
    </h2>
    <p class="subtitle">
      View all customer sales processes including inquiries, orders, and deliveries.
    </p>
  </div>

  <!-- Tiles Section -->
  <div class="sales-tiles">
    <div class="tile" routerLink="inquiries">
      <div class="tile-content">
        <mat-icon class="tile-icon">question_answer</mat-icon>
        <h3>Inquiries</h3>
        <p>View inquiries</p>
      </div>
    </div>

    <div class="tile" routerLink="orders">
      <div class="tile-content">
        <mat-icon class="tile-icon">shopping_bag</mat-icon>
        <h3>Orders</h3>
        <p>View orders</p>
      </div>
    </div>

    <div class="tile" routerLink="deliveries">
      <div class="tile-content">
        <mat-icon class="tile-icon">local_shipping</mat-icon>
        <h3>Deliveries</h3>
        <p>View deliveries</p>
      </div>
    </div>
  </div>

  <router-outlet></router-outlet>
</div>
